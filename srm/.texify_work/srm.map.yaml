# texify map — the single source of truth for converting this source.
# Pages are 1-BASED physical PDF pages (the number shown in a PDF viewer), inclusive.
#
#   chapters:   each is converted, in order, into srm_<nn>.tex.
#   references: reference lists to harvest into <name>.bib.  EMPTY HERE — see below.
#   skipped:    matter recorded for completeness but NOT converted.
#
# HAND-WRITTEN, from the page images (all 75 rendered at 150 dpi and read).
#
#   Society of Actuaries, "Exam SRM — Statistics for Risk Modeling:
#   Sample Questions and Solutions", February 2026 revision.  75 pages.
#
# THE SOURCE'S OWN LAYOUT, and why the divisions are cut where they are:
#
#   p1       front matter: title block, the revision log, the copyright line.
#   p2-p56   the heading "QUESTIONS" and questions 1-75.
#   p57-p75  the heading "SOLUTIONS" and solutions 1-75.
#
# The deliverable INTERLEAVES the two halves — each question immediately followed by its
# own solution — so questions and solutions are converted as SEPARATE divisions and paired
# afterwards by `texify_qa_merge.py`, which matches on the printed number. Converting them
# together is not an option: a chunk is a contiguous page span, and the two halves are 55
# pages apart.
#
# NO `references:` SPAN. This source cites its textbooks in running prose ("See Page 242 of
# Regression Modeling with Actuarial and Financial Applications", "see page 307 of Frees")
# and carries no reference list anywhere. There is nothing for `--bib` to harvest, so the
# bib step is SKIPPED and the master emits no bibliography. Do not invent one: a \cite with
# no reference list renders "[?]" and a fabricated .bib would put entries on the page that
# the source does not have.
#
# ------------------------------------------------------------------------------ sections
# The `sections` under each division are CHUNKING HINTS, not headings. This source has no
# headings below "QUESTIONS"/"SOLUTIONS" — it is a flat numbered list — so each entry marks
# a page whose TOP begins a fresh item, and the chunker (which coalesces adjacent entries up
# to 10 pages) then always cuts BETWEEN items and never inside one.
#
# ⚠ The bracketed titles are labels for the chunk log ONLY. `SKILL.srm.md` states that the
# body must emit no \section, \subsection or heading of any kind for them.
#
# ⚠ p50 HAS NO ENTRY, on purpose. It is the one page in the whole source that does not
# start a new item: question 66's answer choices (D) and (E) run over from p49. Giving p50
# a boundary would let a chunk begin mid-question, which is exactly the seam the hints exist
# to prevent. Every other page of p2-p75 begins a fresh item.
